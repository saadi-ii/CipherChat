# Render blueprint for the LEGACY standalone backend (Express + Socket.IO).
#
# The app now deploys as a single Vercel project (Root Directory = frontend) with
# its API as Next.js Route Handlers - see README.md. This blueprint is only for
# self-hosting the old long-running server instead; point the frontend at it with
# NEXT_PUBLIC_API_URL.
services:
  - type: web
    name: cipherchat-backend
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev is required: NODE_ENV=production below would otherwise make
    # `npm ci` skip devDependencies, and the build needs typescript.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false # e.g. https://cipherchat.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false # 64 hex chars - must stay stable across deploys
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
